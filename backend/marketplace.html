<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared marketplace · WorkPassport Namibia</title>
<style>
:root{font:100%/1.55 system-ui;color:#17372e;background:#f5f6f1}body{max-width:68rem;margin:auto;padding:1.5rem}h1,h2,h3{line-height:1.2}header{border-bottom:2px solid #346b52}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,23rem),1fr));gap:1rem}section{background:white;border:1px solid #c7d6ca;border-radius:.6rem;padding:1rem}label,input,textarea,select{display:block}label{margin:.6rem 0}input,textarea,select{box-sizing:border-box;width:100%;padding:.5rem;font:inherit}input[type=checkbox]{display:inline;width:auto}button{font:inherit;color:white;background:#25543e;border:0;border-radius:.35rem;padding:.5rem .8rem;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #c17c13}article{border-top:1px solid #d9dfd6;padding:.7rem 0}#status{min-height:1.5em}
</style>
<a href="#jobs">Skip to jobs</a>
<header><h1>WorkPassport Namibia</h1><p>Shared marketplace</p></header>
<p id="status" role="status" aria-live="polite"></p>
<main>
<section><h2>Account</h2><p id="identity"></p>
<form id="account"><label>Email<input name="email" type="email" required autocomplete="email"></label>
<label>Password<input type="password" name="password" minlength="12" required autocomplete="current-password"></label>
<button value="login">Sign in</button>
<label>Name for a new account<input name="name" autocomplete="name"></label><button value="register">Create account</button></form>
<button id="logout" hidden>Sign out</button></section>
<section id="jobs" tabindex="-1"><h2>Open jobs</h2><div id="listings"></div></section>
<section><h2>Worker directory</h2><div id="workers"></div></section>
<section data-private hidden><h2>Post a job</h2><form id="post">
<label>Title<input name="title" required></label><label>Town<input name="location" required></label>
<label>Category<input name="category" required></label><label>Work type<select name="work_type"><option>Permanent</option><option>Temporary gig</option><option>Freelance project</option><option>Skilled labour</option></select></label>
<label>Description<textarea name="description" required></textarea></label>
<label>Posting as<select name="organization_id" id="orgs"><option value="">Myself</option></select></label>
<button>Publish job</button></form></section>
<section data-private hidden><h2>Business workspace</h2><form id="organization">
<label>Trading name<input name="name" required></label><label>Business status<select name="status"><option>informal</option><option>registered</option></select></label><button>Create workspace</button></form></section>
<section data-private hidden><h2>Worker profile</h2><form id="profile">
<label>Headline<input name="headline" required></label><label>Town<input name="location" required></label>
<label>About your work<textarea name="bio" required></textarea></label><label><input type="checkbox" name="published"> Show in public worker directory</label>
<button>Save profile</button></form></section>
<section data-private hidden><h2>Applications</h2><div id="applications"></div></section>
<section data-private hidden><h2>Work history</h2><form id="history">
<label>Role or project<input name="title" required></label><label>Work completed<textarea name="description" required></textarea></label>
<label><input type="checkbox" name="review"> Request an independent reference review</label><button>Save work history</button></form></section>
<section data-private hidden><h2>My quotations</h2><div id="quotes"></div></section>
<section data-private hidden><h2>Marketplace help</h2><form id="help"><label>Question<input name="question" maxlength="300" required></label><button>Ask</button></form><p id="answer" aria-live="polite"></p></section>
</main>
<script type="module">
const el = id => document.getElementById(id);
const report = message => { el("status").textContent = message; };
async function api(path, method="GET", body) {
  const response = await fetch("/api/"+path,{method,headers:{"Content-Type":"application/json","X-WorkPassport":"1"},body:body && JSON.stringify(body)});
  const data = await response.json();
  if (!response.ok) throw Object.assign(new Error(typeof data.detail==="string"?data.detail:"Check the fields and try again."),{status:response.status});
  return data;
}
function card(container,title,details) {
  const article=document.createElement("article"), heading=document.createElement("h3");
  heading.textContent=title; article.append(heading);
  for (const detail of details) { const p=document.createElement("p"); p.textContent=detail; article.append(p); }
  container.append(article); return article;
}
async function refresh() {
  let user;
  try { user=await api("me"); } catch(error){if(error.status!==401) throw error;}
  el("identity").textContent=user?user.display_name:"Sign in to post a job or apply.";
  el("account").hidden=!!user; el("logout").hidden=!user;
  document.querySelectorAll("[data-private]").forEach(section=>section.hidden=!user);
  const [jobs,workers,applications,orgs,profile]=await Promise.all([api("jobs"),api("workers"),user?api("applications"):[],user?api("organizations"):[],user?api("profile"):null]);
  for (const [id,items,empty] of [["listings",jobs,"No open jobs yet."],["workers",workers,"No published profiles yet."],["applications",applications,"No applications yet."]]) el(id).textContent=items.length?"":empty;
  el("orgs").replaceChildren(new Option("Myself",""));
  for(const org of orgs) if(org.role!=="member") el("orgs").add(new Option(org.trading_name,org.id));
  el("profile").reset();
  if(profile) {
    for(const key of ["headline","location","bio"]) el("profile").elements[key].value=profile[key];
    el("profile").elements.published.checked=profile.published;
  }
  for(const job of jobs){
    const article=card(el("listings"),job.title,[job.poster+" · "+job.location,job.description]);
    if(user && job.posted_by!==user.id){
      const form=document.createElement("form"), label=document.createElement("label"), input=document.createElement("textarea"), button=document.createElement("button");
      label.textContent="Application message"; input.required=true; input.name="message"; label.append(input);
      button.textContent="Apply"; form.append(label,button); article.append(form);
      submit(form,data=>api("jobs/"+job.id+"/applications","POST",data),"Application submitted.");
    }
  }
  for(const worker of workers) {
    const article=card(el("workers"),worker.display_name,[worker.headline+" · "+worker.location,worker.bio]);
    const history=document.createElement("button"); history.textContent="View work history"; article.append(history);
    history.onclick=async()=>{
      try {
        const entries=await api("workers/"+worker.user_id+"/history");
        if(!entries.length) report("No work history listed.");
        for(const entry of entries) card(article,entry.title,[entry.description,entry.reference_confirmed?"Reference confirmed":"Self-reported"]);
        history.disabled=true;
      }catch(error){report(error.message);}
    };
    if(user && user.id!==worker.user_id) actionForm(article,"Describe the work","Request quotation",
      value=>api("quotations","POST",{worker_id:worker.user_id,description:value}));
  }
  const quotations=user?await api("quotations"):[];
  el("quotes").textContent=quotations.length?"":"No quotations yet.";
  for(const q of quotations){
    const article=card(el("quotes"),q.description,[q.status, q.offered_nad==null?"Awaiting price":"N$ "+q.offered_nad]);
    if(q.status==="requested" && user.id===q.worker_id)
      actionForm(article,"Offer in NAD","Send offer",value=>api("quotations/"+q.id+"/offer","PUT",{amount:value}),"number");
    if(q.status==="offered" && user.id===q.requester_id){
      const form=document.createElement("form"),button=document.createElement("button");
      button.textContent="Accept offer";form.append(button);article.append(form);
      submit(form,()=>api("quotations/"+q.id+"/accept","PUT"),"Offer accepted.");
    }
  }
  for(const item of applications) card(el("applications"),item.title,[item.applicant+" · "+item.status,item.message]);
}
function actionForm(container,labelText,buttonText,action,type="text"){
  const form=document.createElement("form"),label=document.createElement("label"),input=document.createElement("input"),button=document.createElement("button");
  label.textContent=labelText;input.type=type;input.name="value";input.required=true;
  if(type==="number"){input.min="0";input.step="0.01";}
  label.append(input);button.textContent=buttonText;form.append(label,button);container.append(form);
  submit(form,data=>action(data.value),"Quotation updated.");
}
function submit(form,action,success){
  form.onsubmit=async event=>{
    event.preventDefault(); const button=event.submitter; if(button) button.disabled=true;
    try{await action(Object.fromEntries(new FormData(form)),button); form.reset(); await refresh();report(success);}
    catch(error){report(error.message);}finally{if(button) button.disabled=false;}
  };
}
submit(el("account"),(data,button)=>api(button.value,"POST",data),"Signed in.");
submit(el("post"),data=>api("jobs","POST",{...data,organization_id:data.organization_id||null}),"Job published.");
submit(el("profile"),data=>api("profile","PUT",{...data,published:data.published==="on"}),"Profile saved.");
submit(el("organization"),data=>api("organizations","POST",data),"Workspace created.");
submit(el("history"),data=>api("history","POST",{title:data.title,description:data.description,request_review:data.review==="on"}),"Work history saved.");
submit(el("help"),async data=>{el("answer").textContent=(await api("help","POST",data)).answer;},"Help updated.");
el("logout").onclick=async()=>{try{await api("logout","POST");await refresh();report("Signed out.");}catch(error){report(error.message);}};
refresh().catch(error=>report(error.message));
</script>
</html>
