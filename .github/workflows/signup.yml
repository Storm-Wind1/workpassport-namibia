name: Signup journeys
on: [pull_request]
permissions:
  contents: read
jobs:
  signup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: npm install --prefix frontend-checks --no-save playwright@1.56.1
      - run: frontend-checks/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          bun run dev --host 127.0.0.1 --port 5173 > /tmp/workpassport-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          node frontend-checks/controls.mjs || { cat /tmp/workpassport-vite.log; exit 1; }
          node frontend-checks/signup.mjs || { cat /tmp/workpassport-vite.log; exit 1; }
